<div class="pyramid-container">
  <div class="pyramid-header">
    <div class="luxury-badge">Haute Parfumerie</div>
    <h3 class="pyramid-title">Arquitectura Olfativa</h3>
    <p class="pyramid-subtitle">Evolución de acordes sensoriales en piel</p>
  </div>

  <div class="pyramid-layout">
    <!-- SVG Interactivo de la Pirámide -->
    <div class="svg-wrapper">
      <svg viewBox="0 0 320 280" class="pyramid-svg">
        <defs>
          <linearGradient id="goldTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCE08B" />
            <stop offset="100%" stop-color="#D4AF37" />
          </linearGradient>
          <linearGradient id="goldHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E5C158" />
            <stop offset="100%" stop-color="#B8860B" />
          </linearGradient>
          <linearGradient id="goldBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#B8860B" />
            <stop offset="100%" stop-color="#7B5608" />
          </linearGradient>
          <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Nivel 1: Notas de Salida (Cúspide) -->
        <polygon 
          points="160,20 205,95 115,95" 
          class="tier-poly top-tier" 
          [class.active]="activeTier === 'top'"
          (click)="selectTier('top')"
          (mouseenter)="selectTier('top')"/>
        <text x="160" y="70" text-anchor="middle" class="svg-tier-label" (click)="selectTier('top')">
          SALIDA
        </text>

        <!-- Nivel 2: Notas de Corazón (Cuerpo Central) -->
        <polygon 
          points="112,100 208,100 248,175 72,175" 
          class="tier-poly heart-tier" 
          [class.active]="activeTier === 'heart'"
          (click)="selectTier('heart')"
          (mouseenter)="selectTier('heart')"/>
        <text x="160" y="145" text-anchor="middle" class="svg-tier-label" (click)="selectTier('heart')">
          CORAZÓN
        </text>

        <!-- Nivel 3: Notas de Fondo (Base Sólida) -->
        <polygon 
          points="69,180 251,180 290,255 30,255" 
          class="tier-poly base-tier" 
          [class.active]="activeTier === 'base'"
          (click)="selectTier('base')"
          (mouseenter)="selectTier('base')"/>
        <text x="160" y="225" text-anchor="middle" class="svg-tier-label" (click)="selectTier('base')">
          FONDO
        </text>
      </svg>

      <!-- Partículas flotantes de fragancia -->
      <div class="particles-aura">
        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
      </div>
    </div>

    <!-- Panel de Detalle Sensorial -->
    <div class="tier-details-card">
      <div class="tier-nav">
        <button 
          class="tier-btn" 
          [class.active]="activeTier === 'top'" 
          (click)="selectTier('top')">
          Salida
        </button>
        <button 
          class="tier-btn" 
          [class.active]="activeTier === 'heart'" 
          (click)="selectTier('heart')">
          Corazón
        </button>
        <button 
          class="tier-btn" 
          [class.active]="activeTier === 'base'" 
          (click)="selectTier('base')">
          Fondo
        </button>
      </div>

      <div class="tier-body">
        <div class="tier-header-info">
          <span class="tier-icon">
            <ion-icon name="sparkles" *ngIf="activeTier === 'top'"></ion-icon>
            <ion-icon name="heart" *ngIf="activeTier === 'heart'"></ion-icon>
            <ion-icon name="shield-checkmark" *ngIf="activeTier === 'base'"></ion-icon>
          </span>
          <div>
            <h4 class="tier-active-title">{{ getActiveTitle() }}</h4>
            <span class="tier-duration-tag">{{ getActiveDuration() }}</span>
          </div>
        </div>

        <div class="notes-chips-container">
          <span class="note-chip" *ngFor="let note of getActiveNotes()">
            <span class="chip-dot"></span>
            {{ note }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
